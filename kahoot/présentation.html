<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Présentation - QuizMaster</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --primary:#7c3aed; --primary-dark:#5b21b6; --primary-light:#a78bfa;
  --accent:#f59e0b; --bg:#0f0b1e; --panel:#171130; --panel2:#1e1840; --border:#302a52;
  --text:#f1eefb; --muted:#a99fd1;
  --red:#e21b3c; --blue:#1368ce; --yellow:#d89e00; --green:#26890c; --purple:#8b5cf6; --teal:#0891b2;
  --ok:#22c55e; --danger:#ef4444;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Poppins',sans-serif; background:radial-gradient(circle at 50% 0%, #2a1a5e 0%, var(--bg) 60%); color:var(--text); min-height:100vh; overflow-x:hidden;}
.screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:30px; position:relative;}
.btn{border:none; border-radius:12px; padding:13px 22px; font-family:inherit; font-weight:700; cursor:pointer; font-size:1rem; display:inline-flex; align-items:center; gap:10px; transition:.15s;}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; box-shadow:0 6px 20px rgba(124,58,237,.35);}
.btn-primary:hover{transform:translateY(-2px); filter:brightness(1.1);}
.btn-ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
.btn-lg{padding:16px 34px; font-size:1.15rem; border-radius:14px;}

/* --- Select quiz screen --- */
.select-wrap{max-width:640px; width:100%; text-align:center;}
.select-wrap h1{font-size:2rem; font-weight:900; margin-bottom:8px;}
.select-wrap p{color:var(--muted); margin-bottom:26px;}
.quiz-pick{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 20px; text-align:left; cursor:pointer; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; transition:.15s;}
.quiz-pick:hover{border-color:var(--primary-light);}
.quiz-pick .t{font-weight:700;}
.quiz-pick .m{font-size:0.82rem; color:var(--muted);}

/* --- Lobby --- */
.lobby-top{display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:20px;}
.pin-box{background:#fff; color:#1a1030; border-radius:16px; padding:18px 40px; text-align:center;}
.pin-box .lbl{font-size:0.85rem; font-weight:600; color:#6b5c99;}
.pin-box .pin{font-size:3rem; font-weight:900; letter-spacing:6px;}
.join-hint{color:var(--muted); font-size:0.95rem;}
.qr{margin-top:10px; border-radius:10px; overflow:hidden;}
.players-panel{width:100%; max-width:900px; margin-top:26px;}
.players-count{text-align:center; font-weight:700; font-size:1.2rem; margin-bottom:14px;}
.players-grid{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-height:34vh; overflow-y:auto; padding:4px;}
.player-chip{background:var(--panel); border:1px solid var(--border); padding:10px 18px; border-radius:30px; font-weight:600; animation:pop .25s;}
@keyframes pop{from{transform:scale(.7); opacity:0;} to{transform:scale(1); opacity:1;}}
.lobby-actions{margin-top:28px; display:flex; gap:12px;}

/* --- Question screen --- */
.qtop{position:absolute; top:20px; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:0 30px;}
.qcounter{background:var(--panel2); border:1px solid var(--border); padding:8px 16px; border-radius:20px; font-weight:700; font-size:0.9rem;}
.timer-ring{width:60px; height:60px; border-radius:50%; background:var(--panel2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.3rem;}
.answer-count{background:var(--panel2); border:1px solid var(--border); padding:8px 16px; border-radius:20px; font-weight:700; font-size:0.9rem;}
.q-body{max-width:900px; width:100%; text-align:center; margin-top:80px;}
.q-body img{max-width:100%; max-height:220px; border-radius:14px; margin-bottom:16px;}
.q-text{font-size:2rem; font-weight:800; line-height:1.3; margin-bottom:10px;}
.timerbar-wrap{width:100%; max-width:700px; height:10px; background:var(--panel2); border-radius:10px; overflow:hidden; margin:20px 0 30px;}
.timerbar{height:100%; background:linear-gradient(90deg,var(--accent),var(--primary)); width:100%; transition:width 1s linear;}
.options-grid{width:100%; max-width:900px; display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.opt-box{border-radius:14px; padding:22px; font-size:1.3rem; font-weight:700; display:flex; align-items:center; gap:14px; color:#fff; min-height:70px; position:relative; overflow:hidden;}
.opt-box .cnt{margin-left:auto; background:rgba(0,0,0,.25); border-radius:10px; padding:4px 12px; font-size:1rem;}
.opt-shape{width:26px; height:26px; flex-shrink:0;}
.curseur-box, .texte-box, .ordre-box, .nuage-box{max-width:700px; width:100%; text-align:center;}
.big-num{font-size:3rem; font-weight:900; color:var(--accent);}
.wordcloud{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:800px; margin-top:20px;}
.wc-item{background:var(--panel2); border:1px solid var(--border); padding:10px 18px; border-radius:12px; font-weight:600;}

/* --- Results --- */
.results-body{max-width:800px; width:100%; text-align:center; margin-top:60px;}
.result-stats{display:flex; justify-content:center; gap:30px; margin:22px 0 30px;}
.rstat{text-align:center;}
.rstat .n{font-size:2.2rem; font-weight:900;}
.rstat .l{color:var(--muted); font-size:0.85rem;}
.bars{display:flex; flex-direction:column; gap:10px; max-width:700px; margin:0 auto;}
.bar-row{display:flex; align-items:center; gap:12px;}
.bar-label{width:160px; text-align:right; font-size:0.9rem; font-weight:600; flex-shrink:0;}
.bar-track{flex:1; height:34px; background:var(--panel2); border-radius:8px; overflow:hidden; text-align:left;}
.bar-fill{height:100%; display:flex; align-items:center; padding-left:10px; font-weight:700; font-size:0.85rem; transition:width .6s ease;}

/* --- Leaderboard --- */
.podium{display:flex; align-items:flex-end; gap:16px; margin:30px 0;}
.podium .p{background:var(--panel); border:1px solid var(--border); border-radius:14px 14px 0 0; width:150px; text-align:center; padding:14px 10px;}
.podium .p1{height:170px; order:2; border-color:var(--accent); background:linear-gradient(180deg, rgba(245,158,11,.25), var(--panel));}
.podium .p2{height:130px; order:1;}
.podium .p3{height:100px; order:3;}
.podium .medal{font-size:1.8rem;}
.podium .name{font-weight:700; margin:6px 0 2px; word-break:break-word;}
.podium .score{color:var(--muted); font-size:0.85rem;}
.lb-list{max-width:600px; width:100%; display:flex; flex-direction:column; gap:8px;}
.lb-row{display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 18px;}
.lb-rank{width:28px; font-weight:800; color:var(--primary-light);}
.lb-name{flex:1; font-weight:600;}
.lb-score{font-weight:800;}

.footer-controls{position:fixed; bottom:24px; left:0; right:0; display:flex; justify-content:center; gap:12px;}
.pin-mini{position:fixed; top:20px; right:20px; background:var(--panel2); border:1px solid var(--border); padding:8px 16px; border-radius:10px; font-weight:700; font-size:0.85rem;}
.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5;}
.confetti span{position:absolute; top:-10px; width:8px; height:14px; opacity:.9; animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}
/* =========================================================
   PRESENTATEUR
========================================================= */

.presentation-settings{
  position:fixed;
  top:20px;
  left:20px;
  width:48px;
  height:48px;
  border-radius:50%;
  border:1px solid var(--border);
  background:rgba(23,17,48,.9);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.15rem;
  cursor:pointer;
  z-index:30;
  transition:.2s;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.presentation-settings:hover{
  transform:rotate(35deg) scale(1.08);
  background:var(--primary);
}

/* ===== Panneau participants ===== */

.participants-panel{
  position:fixed;
  top:0;
  left:0;
  bottom:0;
  width:360px;
  max-width:90vw;
  background:#130e28;
  border-right:1px solid var(--border);
  z-index:100;
  transform:translateX(-105%);
  transition:transform .3s ease;
  box-shadow:15px 0 50px rgba(0,0,0,.4);
  display:flex;
  flex-direction:column;
}

.participants-panel.open{
  transform:translateX(0);
}

.participants-head{
  padding:22px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.participants-head h2{
  font-size:1.15rem;
  font-weight:800;
}

.participants-head button{
  width:38px;
  height:38px;
  border:none;
  border-radius:10px;
  background:var(--panel2);
  color:#fff;
  cursor:pointer;
  font-size:1rem;
}

.participants-count{
  padding:16px 22px;
  color:var(--muted);
  border-bottom:1px solid var(--border);
}

.participants-list{
  padding:14px;
  overflow-y:auto;
  flex:1;
}

.participant-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border-radius:12px;
  background:var(--panel);
  border:1px solid var(--border);
  margin-bottom:8px;
}

.participant-avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  flex-shrink:0;
}

.participant-name{
  flex:1;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.kick-btn{
  border:none;
  background:rgba(239,68,68,.12);
  color:#f87171;
  width:34px;
  height:34px;
  border-radius:9px;
  cursor:pointer;
  transition:.15s;
}

.kick-btn:hover{
  background:var(--danger);
  color:#fff;
}

.participants-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  backdrop-filter:blur(3px);
  z-index:90;
  display:none;
}

.participants-overlay.show{
  display:block;
}

/* =========================================================
   ECRAN "ÊTES-VOUS PRÊTS"
========================================================= */

.ready-screen{
  text-align:center;
  max-width:900px;
  width:100%;
}

.ready-icon{
  width:110px;
  height:110px;
  margin:0 auto 25px;
  border-radius:35px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:3rem;
  box-shadow:0 20px 50px rgba(124,58,237,.35);
  animation:readyFloat 2.5s ease-in-out infinite;
}

@keyframes readyFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.ready-screen h1{
  font-size:clamp(2.5rem,6vw,5rem);
  font-weight:900;
  line-height:1;
  margin-bottom:15px;
}

.ready-screen .subtitle{
  color:var(--muted);
  font-size:1.1rem;
  margin-bottom:30px;
}

.ready-players{
  display:inline-flex;
  align-items:center;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:30px;
  padding:12px 20px;
  font-weight:700;
  margin-bottom:35px;
}

.ready-players i{
  color:var(--primary-light);
}

/* =========================================================
   REACTIONS
========================================================= */

#reactionOverlay{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:200;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  transition:opacity .3s;
}

#reactionOverlay.show{
  opacity:1;
}

.reaction-popup{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation:reactionPop .45s cubic-bezier(.17,.67,.32,1.4);
}

.reaction-emoji{
  font-size:clamp(7rem,18vw,14rem);
  line-height:1;
  filter:drop-shadow(0 15px 30px rgba(0,0,0,.4));
}

.reaction-name{
  margin-top:20px;
  background:rgba(15,11,30,.92);
  border:1px solid var(--border);
  padding:10px 22px;
  border-radius:30px;
  font-weight:800;
  font-size:1.1rem;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}

@keyframes reactionPop{
  0%{
    transform:scale(.2) rotate(-15deg);
    opacity:0;
  }
  65%{
    transform:scale(1.15) rotate(4deg);
    opacity:1;
  }
  100%{
    transform:scale(1) rotate(0);
    opacity:1;
  }
}

/* petites réactions flottantes */

.floating-reaction{
  position:fixed;
  bottom:-80px;
  font-size:2.5rem;
  pointer-events:none;
  z-index:50;
  animation:floatReaction 3s ease-out forwards;
}

@keyframes floatReaction{
  0%{
    transform:translateY(0) scale(.7);
    opacity:0;
  }
  15%{
    opacity:1;
    transform:translateY(-40px) scale(1);
  }
  100%{
    transform:translateY(-90vh) scale(1.2) rotate(20deg);
    opacity:0;
  }
}
</style>
</head>
<body>

<div id="root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  doc,
  addDoc,
  updateDoc,
  deleteDoc,
  onSnapshot,
  getDoc,
  getDocs,
  query,
  where,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyBxXW6RH9paJ66E_8E_bQpR688bTfYvBSY",
  authDomain: "samu-5ede0.firebaseapp.com",
  projectId: "samu-5ede0",
  storageBucket: "samu-5ede0.firebasestorage.app",
  messagingSenderId: "613056086995",
  appId: "1:613056086995:web:d63e43f0ed9334bbb2e526",
  measurementId: "G-251GWK26LC"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const OPT_COLORS = [
  {bg:"var(--red)", icon:"fa-solid fa-play", shape:"triangle"},
  {bg:"var(--blue)", icon:"fa-solid fa-diamond", shape:"diamond"},
  {bg:"var(--yellow)", icon:"fa-solid fa-circle", shape:"circle"},
  {bg:"var(--green)", icon:"fa-solid fa-square", shape:"square"},
  {bg:"var(--purple)", icon:"fa-solid fa-star", shape:"star"},
  {bg:"var(--teal)", icon:"fa-solid fa-heart", shape:"heart"},
];

const root = document.getElementById("root");
const urlParams = new URLSearchParams(location.search);
let quizId = urlParams.get("quiz");
let sessionId = null, sessionData = null, quiz = null, questions = [];
let unsubSession = null, unsubPlayers = null, unsubAnswers = null; unsubReactions = null;
let players = [];
let currentAnswers = [];
let timerInterval = null;

if(quizId){
  loadQuizAndInit();
} else {
  renderQuizSelect();
}
function listenReactions(){
  if(unsubReactions) unsubReactions();

  unsubReactions = onSnapshot(
    query(
      collection(db, "sessions", sessionId, "reactions"),
      orderBy("createdAt", "desc")
    ),
    snap => {
      const newReactions = snap.docChanges()
        .filter(change => change.type === "added")
        .map(change => ({
          id: change.doc.id,
          ...change.doc.data()
        }));

      newReactions.reverse().forEach(reaction => {
        reactionQueue.push(reaction);
      });

      afficherProchaineReaction();
    }
  );
}

function afficherProchaineReaction(){
  if(reactionDisplaying || !reactionQueue.length) return;

  const reaction = reactionQueue.shift();
  reactionDisplaying = true;

  const container = document.getElementById("reactionOverlay");

  if(!container){
    reactionDisplaying = false;
    return;
  }

  const emoji = reaction.emoji || "❤️";
  const name = reaction.name || "Quelqu'un";

  container.innerHTML = `
    <div class="reaction-popup">
      <div class="reaction-emoji">${escapeHtml(emoji)}</div>
      <div class="reaction-name">${escapeHtml(name)}</div>
    </div>
  `;

  container.classList.add("show");

  // Petite réaction flottante sur un côté
  const floating = document.createElement("div");

  floating.className = "floating-reaction";
  floating.textContent = emoji;
  floating.style.left = (10 + Math.random() * 80) + "%";

  document.body.appendChild(floating);

  setTimeout(() => floating.remove(), 3000);

  setTimeout(() => {
    container.classList.remove("show");

    setTimeout(() => {
      container.innerHTML = "";
      reactionDisplaying = false;
      afficherProchaineReaction();
    }, 300);

  }, 2200);
}async function renderQuizSelect(){
  root.innerHTML = `<div class="screen"><div class="select-wrap">
    <h1><i class="fa-solid fa-bolt"></i> QuizMaster</h1>
    <p>Choisissez un quiz à lancer</p>
    <div id="picks"></div>
  </div></div>`;
  const snap = await getDocs(query(collection(db,"quizzes"), orderBy("updatedAt","desc")));
  const picks = document.getElementById("picks");
  if(snap.empty){ picks.innerHTML = `<p style="color:var(--muted)">Aucun quiz. Créez-en un depuis gestion.html</p>`; return; }
  snap.forEach(d=>{
    const q = d.data();
    const el = document.createElement("div");
    el.className = "quiz-pick";
    el.innerHTML = `<div><div class="t">${q.title||"Sans titre"}</div><div class="m">${q.questionCount||0} question(s)</div></div><i class="fa-solid fa-chevron-right"></i>`;
    el.onclick = ()=>{ quizId = d.id; loadQuizAndInit(); };
    picks.appendChild(el);
  });
}

async function loadQuizAndInit(){
  const qSnap = await getDoc(doc(db,"quizzes",quizId));
  quiz = qSnap.data();
  const qsSnap = await getDocs(query(collection(db,"quizzes",quizId,"questions"), orderBy("order","asc")));
  questions = qsSnap.docs.map(d=>({id:d.id, ...d.data()}));
  if(!questions.length){ root.innerHTML = `<div class="screen"><p>Ce quiz n'a aucune question. Ajoutez-en dans gestion.html</p></div>`; return; }
  await createSession();
}

function genPin(){ return String(Math.floor(100000 + Math.random()*900000)); }

async function createSession(){
  const pin = genPin();
  const ref = await addDoc(collection(db,"sessions"), {
    pin, quizId, status:"lobby", currentIndex:-1, createdAt: serverTimestamp(), questionStartedAt:null
  });
  sessionId = ref.id;
  listenSession();
  listenPlayers();
  listenReactions();
}

function listenSession(){
  if(unsubSession) unsubSession();
  unsubSession = onSnapshot(doc(db,"sessions",sessionId), snap=>{
    sessionData = snap.data();
    if(!sessionData) return;
    render();
  });
}
function listenPlayers(){
  if(unsubPlayers) unsubPlayers();

  unsubPlayers = onSnapshot(
    query(
      collection(db,"sessions",sessionId,"players"),
      orderBy("score","desc")
    ),
    snap => {

      players = snap.docs.map(d => ({
        id:d.id,
        ...d.data()
      }));

      if(sessionData && sessionData.status === "lobby"){
        render();

        // Mise à jour instantanée du compteur
        const count = document.getElementById("readyPlayersCount");

        if(count){
          count.textContent =
            `${players.length} participant${players.length > 1 ? "s" : ""}`;
        }
      }
    }
  );
}
function listenAnswersForCurrent(){
  if(unsubAnswers) unsubAnswers();
  unsubAnswers = onSnapshot(query(collection(db,"sessions",sessionId,"answers"), where("questionIndex","==", sessionData.currentIndex)), snap=>{
    currentAnswers = snap.docs.map(d=>d.data());
    updateAnswerCount();
  });
}
function updateAnswerCount(){
  const el = document.getElementById("answerCount");
  if(el) el.textContent = `${currentAnswers.length} / ${players.length} réponses`;
}

function render(){
  if(!sessionData) return;

  // Overlay réactions permanent
  if(!document.getElementById("reactionOverlay")){
    const overlay = document.createElement("div");
    overlay.id = "reactionOverlay";
    document.body.appendChild(overlay);
  }

  if(sessionData.status==="lobby") return renderLobby();
  if(sessionData.status==="question") return renderQuestion();
  if(sessionData.status==="results") return renderResults();
  if(sessionData.status==="leaderboard") return renderLeaderboard();
  if(sessionData.status==="ended") return renderEnd();
}

function renderLobby(){
  clearInterval(timerInterval);

  const joinUrl =
    new URL("réponse.html", location.href).href +
    "?pin=" + sessionData.pin;

  root.innerHTML = `
    <button class="presentation-settings" id="settingsBtn" title="Participants">
      <i class="fa-solid fa-gear"></i>
    </button>

    <div class="participants-overlay" id="participantsOverlay"></div>

    <div class="participants-panel" id="participantsPanel">
      <div class="participants-head">
        <h2><i class="fa-solid fa-users"></i> Participants</h2>
        <button id="closeParticipants">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="participants-count">
        <b>${players.length}</b> participant(s) connecté(s)
      </div>

      <div class="participants-list" id="participantsList"></div>
    </div>

    <div class="screen">

      <div class="ready-screen">

        <div class="ready-icon">
          <i class="fa-solid fa-bolt"></i>
        </div>

        <h1>Êtes-vous prêts ?</h1>

        <div class="subtitle">
          Rejoignez la partie avec le code ci-dessous
        </div>

        <div class="pin-box" style="display:inline-block;">
          <div class="lbl">CODE PIN</div>
          <div class="pin">${sessionData.pin}</div>
        </div>

        <div style="margin:20px 0;">
          <img
            class="qr"
            width="150"
            height="150"
            src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(joinUrl)}"
            alt="QR code"
          >
        </div>

        <div class="ready-players">
          <i class="fa-solid fa-users"></i>
          <span id="readyPlayersCount">
            ${players.length} participant${players.length > 1 ? "s" : ""}
          </span>
        </div>

        <div>
          <button
            class="btn btn-primary btn-lg"
            id="startBtn"
            ${players.length ? "" : "disabled"}
          >
            <i class="fa-solid fa-play"></i>
            C'est parti !
          </button>
        </div>

        <p style="
          margin-top:18px;
          color:var(--muted);
          font-size:.85rem;
        ">
          Les participants apparaîtront automatiquement ici
        </p>

      </div>
    </div>
  `;

  renderParticipantsList();

  const panel = document.getElementById("participantsPanel");
  const overlay = document.getElementById("participantsOverlay");

  document.getElementById("settingsBtn").onclick = () => {
    panel.classList.add("open");
    overlay.classList.add("show");
  };

  document.getElementById("closeParticipants").onclick = closeParticipants;
  overlay.onclick = closeParticipants;

  document.getElementById("startBtn").onclick = () => {
    nextQuestion();
  };
}
function renderParticipantsList(){
  const list = document.getElementById("participantsList");

  if(!list) return;

  if(!players.length){
    list.innerHTML = `
      <div style="
        text-align:center;
        padding:40px 15px;
        color:var(--muted);
      ">
        <i class="fa-solid fa-user-slash"
           style="font-size:2rem; margin-bottom:12px;"></i>
        <p>Aucun participant</p>
      </div>
    `;
    return;
  }

  list.innerHTML = players.map(p => {
    const initial = escapeHtml(
      (p.name || "?").charAt(0).toUpperCase()
    );

    return `
      <div class="participant-row">
        <div class="participant-avatar">
          ${initial}
        </div>

        <div class="participant-name">
          ${escapeHtml(p.name || "Sans nom")}
        </div>

        <button
          class="kick-btn"
          title="Exclure ${escapeHtml(p.name || "")}"
          data-player-id="${escapeHtml(p.id)}"
        >
          <i class="fa-solid fa-user-xmark"></i>
        </button>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".kick-btn").forEach(btn => {
    btn.onclick = () => {
      kickPlayer(btn.dataset.playerId);
    };
  });
}
function closeParticipants(){
  document
    .getElementById("participantsPanel")
    ?.classList.remove("open");

  document
    .getElementById("participantsOverlay")
    ?.classList.remove("show");
}
async function kickPlayer(playerId){
  const player = players.find(p => p.id === playerId);

  if(!player) return;

  const confirmed = confirm(
    `Exclure "${player.name || "ce participant"}" de la partie ?`
  );

  if(!confirmed) return;

  try{
    await deleteDoc(
      doc(db, "sessions", sessionId, "players", playerId)
    );
  }catch(err){
    console.error("Erreur exclusion participant :", err);
    alert("Impossible d'exclure ce participant.");
  }
}
async function nextQuestion(){
  const next = sessionData.currentIndex + 1;
  if(next >= questions.length){ return endGame(); }
  await updateDoc(doc(db,"sessions",sessionId), {
    currentIndex: next, status:"question", questionStartedAt: Date.now()
  });
}

function renderQuestion(){
  const q = questions[sessionData.currentIndex];
  listenAnswersForCurrent();
  const total = q.time || 20;
  root.innerHTML = `
    <div class="pin-mini">PIN ${sessionData.pin}</div>
    <div class="screen">
      <div class="qtop">
        <div class="qcounter">Question ${sessionData.currentIndex+1} / ${questions.length}</div>
        <div class="timer-ring" id="timerRing">${total}</div>
        <div class="answer-count" id="answerCount">0 / ${players.length} réponses</div>
      </div>
      <div class="q-body">
        ${q.image?`<img src="${q.image}">`:""}
        <div class="q-text">${escapeHtml(q.text)}</div>
        <div class="timerbar-wrap"><div class="timerbar" id="timerBar"></div></div>
      </div>
      ${renderOptionsForType(q)}
      <div class="footer-controls">
        <button class="btn btn-ghost" id="skipBtn"><i class="fa-solid fa-forward"></i> Voir les réponses</button>
      </div>
    </div>`;
  document.getElementById("skipBtn").onclick = ()=> showResults();
  startTimer(total);
}

function renderOptionsForType(q){
  if(q.type==="qcm_single" || q.type==="qcm_multiple" || q.type==="vrai_faux"){
    return `<div class="options-grid">${q.options.map((o,i)=>`
      <div class="opt-box" style="background:${OPT_COLORS[i%OPT_COLORS.length].bg}">
        <i class="${OPT_COLORS[i%OPT_COLORS.length].icon} opt-shape"></i> ${escapeHtml(o.text)}
      </div>`).join("")}</div>`;
  }
  if(q.type==="texte") return `<div class="texte-box"><i class="fa-solid fa-keyboard" style="font-size:2.4rem; color:var(--primary-light);"></i><p style="margin-top:10px; color:var(--muted);">Les participants tapent leur réponse</p></div>`;
  if(q.type==="curseur") return `<div class="curseur-box"><i class="fa-solid fa-sliders" style="font-size:2.4rem; color:var(--primary-light);"></i><p style="margin-top:10px; color:var(--muted);">Les participants choisissent une valeur entre ${q.min} et ${q.max}</p></div>`;
  if(q.type==="ordre") return `<div class="ordre-box"><i class="fa-solid fa-arrow-down-1-9" style="font-size:2.4rem; color:var(--primary-light);"></i><p style="margin-top:10px; color:var(--muted);">Les participants remettent les éléments dans l'ordre</p></div>`;
  if(q.type==="nuage") return `<div class="nuage-box"><i class="fa-solid fa-cloud" style="font-size:2.4rem; color:var(--primary-light);"></i><p style="margin-top:10px; color:var(--muted);">Réponses libres, sans correction</p></div>`;
  return "";
}

function startTimer(total){
  clearInterval(timerInterval);
  const start = Date.now();
  const bar = document.getElementById("timerBar");
  const ring = document.getElementById("timerRing");
  timerInterval = setInterval(()=>{
    const elapsed = (Date.now()-start)/1000;
    const remain = Math.max(0, total-elapsed);
    if(bar) bar.style.width = (remain/total*100)+"%";
    if(ring) ring.textContent = Math.ceil(remain);
    if(remain<=0){ clearInterval(timerInterval); showResults(); }
  }, 200);
}

async function showResults(){
  clearInterval(timerInterval);
  await updateDoc(doc(db,"sessions",sessionId), {status:"results"});
}

function renderResults(){
  const q = questions[sessionData.currentIndex];
  const total = players.length;
  const answered = currentAnswers.length;
  const correctCount = currentAnswers.filter(a=>a.correct).length;
  let barsHtml = "";
  if(["qcm_single","qcm_multiple","vrai_faux"].includes(q.type)){
    barsHtml = `<div class="bars">${q.options.map((o,i)=>{
      const cnt = currentAnswers.filter(a=> Array.isArray(a.value) ? a.value.includes(i) : a.value===i).length;
      const pct = answered ? Math.round(cnt/answered*100) : 0;
      return `<div class="bar-row"><div class="bar-label">${escapeHtml(o.text)} ${o.correct?'<i class="fa-solid fa-check" style="color:var(--ok)"></i>':''}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${OPT_COLORS[i%OPT_COLORS.length].bg}">${cnt}</div></div></div>`;
    }).join("")}</div>`;
  } else if(q.type==="nuage"){
    barsHtml = `<div class="wordcloud">${currentAnswers.map(a=>`<div class="wc-item">${escapeHtml(String(a.value))}</div>`).join("") || '<p style="color:var(--muted)">Aucune réponse</p>'}</div>`;
  } else if(q.type==="curseur"){
    barsHtml = `<p style="color:var(--muted); margin-top:10px;">Valeur correcte : <b style="color:#fff;">${q.correctValue}</b></p>`;
  } else if(q.type==="texte"){
    barsHtml = `<p style="color:var(--muted); margin-top:10px;">Réponses acceptées : <b style="color:#fff;">${q.acceptedAnswers.join(", ")}</b></p>`;
  } else if(q.type==="ordre"){
    barsHtml = `<div class="bars">${q.items.map((it,i)=>`<div class="bar-row"><div class="bar-label" style="width:auto;">${i+1}.</div><div class="bar-track" style="flex:none; padding:6px 16px; background:var(--panel2);">${escapeHtml(it)}</div></div>`).join("")}</div>`;
  }
  root.innerHTML = `
    <div class="pin-mini">PIN ${sessionData.pin}</div>
    <div class="screen">
      <div class="results-body">
        <h2 style="font-size:1.6rem; font-weight:800; margin-bottom:6px;">${escapeHtml(q.text)}</h2>
        ${q.type!=="nuage" ? `<div class="result-stats">
          <div class="rstat"><div class="n">${answered}</div><div class="l">Réponses</div></div>
          <div class="rstat"><div class="n" style="color:var(--ok)">${correctCount}</div><div class="l">Correctes</div></div>
        </div>` : ""}
        ${barsHtml}
      </div>
      <div class="footer-controls">
        <button class="btn btn-primary btn-lg" id="lbBtn"><i class="fa-solid fa-trophy"></i> Classement</button>
      </div>
    </div>`;
  document.getElementById("lbBtn").onclick = async ()=>{ await updateDoc(doc(db,"sessions",sessionId), {status:"leaderboard"}); };
}

function renderLeaderboard(){
  const sorted = [...players].sort((a,b)=>(b.score||0)-(a.score||0));
  const top3 = sorted.slice(0,3);
  const rest = sorted.slice(3,10);
  const isLast = sessionData.currentIndex >= questions.length-1;
  root.innerHTML = `
    <div class="pin-mini">PIN ${sessionData.pin}</div>
    <div class="screen">
      <h1 style="font-weight:900;"><i class="fa-solid fa-trophy" style="color:var(--accent)"></i> Classement</h1>
      <div class="podium">
        ${top3[1]?`<div class="p p2"><div class="medal">🥈</div><div class="name">${escapeHtml(top3[1].name)}</div><div class="score">${top3[1].score||0} pts</div></div>`:""}
        ${top3[0]?`<div class="p p1"><div class="medal">🥇</div><div class="name">${escapeHtml(top3[0].name)}</div><div class="score">${top3[0].score||0} pts</div></div>`:""}
        ${top3[2]?`<div class="p p3"><div class="medal">🥉</div><div class="name">${escapeHtml(top3[2].name)}</div><div class="score">${top3[2].score||0} pts</div></div>`:""}
      </div>
      <div class="lb-list">
        ${rest.map((p,i)=>`<div class="lb-row"><div class="lb-rank">${i+4}</div><div class="lb-name">${escapeHtml(p.name)}</div><div class="lb-score">${p.score||0} pts</div></div>`).join("")}
      </div>
      <div class="footer-controls">
        <button class="btn btn-primary btn-lg" id="nextBtn">${isLast?'<i class="fa-solid fa-flag-checkered"></i> Terminer':'<i class="fa-solid fa-arrow-right"></i> Question suivante'}</button>
      </div>
    </div>`;
  document.getElementById("nextBtn").onclick = ()=> isLast ? endGame() : nextQuestion();
}

async function endGame(){
  await updateDoc(doc(db,"sessions",sessionId), {status:"ended"});
}

function renderEnd(){
  const sorted = [...players].sort((a,b)=>(b.score||0)-(a.score||0));
  const top3 = sorted.slice(0,3);
  root.innerHTML = `
    <div class="confetti" id="confetti"></div>
    <div class="screen">
      <h1 style="font-weight:900; font-size:2.2rem;">🎉 Partie terminée !</h1>
      <div class="podium">
        ${top3[1]?`<div class="p p2"><div class="medal">🥈</div><div class="name">${escapeHtml(top3[1].name)}</div><div class="score">${top3[1].score||0} pts</div></div>`:""}
        ${top3[0]?`<div class="p p1"><div class="medal">🥇</div><div class="name">${escapeHtml(top3[0].name)}</div><div class="score">${top3[0].score||0} pts</div></div>`:""}
        ${top3[2]?`<div class="p p3"><div class="medal">🥉</div><div class="name">${escapeHtml(top3[2].name)}</div><div class="score">${top3[2].score||0} pts</div></div>`:""}
      </div>
      <div class="footer-controls">
        <a class="btn btn-primary btn-lg" href="presentation.html?quiz=${quizId}"><i class="fa-solid fa-rotate-right"></i> Nouvelle partie</a>
        <a class="btn btn-ghost btn-lg" href="gestion.html"><i class="fa-solid fa-gear"></i> Gestion</a>
      </div>
    </div>`;
  launchConfetti();
}
function launchConfetti(){
  const c = document.getElementById("confetti");
  const colors = ["#e21b3c","#1368ce","#d89e00","#26890c","#8b5cf6","#f59e0b"];
  for(let i=0;i<80;i++){
    const s = document.createElement("span");
    s.style.left = Math.random()*100+"%";
    s.style.background = colors[i%colors.length];
    s.style.animationDuration = (2+Math.random()*2)+"s";
    s.style.animationDelay = (Math.random()*1.5)+"s";
    c.appendChild(s);
  }
}

function escapeHtml(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
</script>
</body>

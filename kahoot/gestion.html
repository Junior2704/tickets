<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion des Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --primary:#7c3aed; --primary-dark:#5b21b6; --primary-light:#a78bfa;
  --accent:#f59e0b; --bg:#0f0b1e; --panel:#171130; --panel2:#1e1840;
  --border:#302a52; --text:#f1eefb; --muted:#a99fd1;
  --red:#e21b3c; --blue:#1368ce; --yellow:#d89e00; --green:#26890c; --purple:#8b5cf6; --teal:#0891b2;
  --ok:#22c55e; --danger:#ef4444;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Poppins',sans-serif; background:radial-gradient(circle at 20% 0%, #2a1a5e 0%, var(--bg) 55%); color:var(--text); min-height:100vh;}
.app{display:grid; grid-template-columns:300px 1fr; min-height:100vh;}
.sidebar{background:var(--panel); border-right:1px solid var(--border); padding:20px; display:flex; flex-direction:column; gap:16px;}
.logo{font-weight:800; font-size:1.3rem; display:flex; align-items:center; gap:8px; color:#fff;}
.logo i{color:var(--accent);}
.btn{border:none; border-radius:10px; padding:11px 16px; font-family:inherit; font-weight:600; cursor:pointer; font-size:0.92rem; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.15s;}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff;}
.btn-primary:hover{filter:brightness(1.12); transform:translateY(-1px);}
.btn-ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{background:#28214a;}
.btn-danger{background:rgba(239,68,68,.15); color:#fca5a5; border:1px solid rgba(239,68,68,.35);}
.btn-danger:hover{background:rgba(239,68,68,.28);}
.btn-sm{padding:6px 10px; font-size:0.8rem; border-radius:8px;}
.quiz-list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px;}
.quiz-item{background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:12px; cursor:pointer; transition:.15s;}
.quiz-item:hover{border-color:var(--primary-light);}
.quiz-item.active{border-color:var(--primary); background:rgba(124,58,237,.18);}
.quiz-item .qt{font-weight:600; font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.quiz-item .qm{font-size:0.75rem; color:var(--muted); margin-top:3px;}
.main{padding:28px 34px; overflow-y:auto;}
.empty-state{display:flex; flex-direction:column; align-items:center; justify-content:center; height:70vh; color:var(--muted); text-align:center; gap:14px;}
.empty-state i{font-size:3rem; color:var(--primary-light); opacity:.6;}
.quiz-header{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; flex-wrap:wrap;}
.quiz-title-input{background:transparent; border:none; font-size:1.7rem; font-weight:800; color:#fff; font-family:inherit; width:100%; outline:none; border-bottom:2px solid transparent;}
.quiz-title-input:focus{border-bottom:2px solid var(--primary);}
.quiz-desc-input{background:transparent; border:none; color:var(--muted); font-family:inherit; width:100%; outline:none; font-size:0.92rem; margin-top:4px; resize:none;}
.header-actions{display:flex; gap:10px; flex-shrink:0;}
.stats-row{display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap;}
.stat-chip{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px 16px; font-size:0.85rem; color:var(--muted); display:flex; gap:8px; align-items:center;}
.stat-chip b{color:#fff;}
.questions{display:flex; flex-direction:column; gap:12px;}
.qcard{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px; display:flex; gap:14px; align-items:flex-start;}
.qnum{width:34px; height:34px; border-radius:9px; background:var(--panel2); display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; color:var(--primary-light);}
.qcard-body{flex:1; min-width:0;}
.qcard-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}
.qtype-badge{display:inline-flex; align-items:center; gap:6px; font-size:0.72rem; font-weight:700; padding:3px 9px; border-radius:20px; background:rgba(124,58,237,.2); color:var(--primary-light); text-transform:uppercase; letter-spacing:.3px; margin-bottom:6px;}
.qtext{font-weight:600; font-size:1rem; word-break:break-word;}
.qmeta{font-size:0.78rem; color:var(--muted); margin-top:6px; display:flex; gap:14px; flex-wrap:wrap;}
.qopts{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.opt-pill{font-size:0.78rem; padding:4px 10px; border-radius:8px; background:var(--panel2); border:1px solid var(--border);}
.opt-pill.correct{background:rgba(34,197,94,.18); border-color:rgba(34,197,94,.5); color:#86efac;}
.qactions{display:flex; gap:6px; flex-shrink:0;}
.icon-btn{background:var(--panel2); border:1px solid var(--border); color:var(--muted); width:32px; height:32px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.15s;}
.icon-btn:hover{color:#fff; border-color:var(--primary-light);}
.add-q-btn{border:2px dashed var(--border); background:transparent; color:var(--muted); border-radius:14px; padding:18px; cursor:pointer; font-weight:600; display:flex; align-items:center; justify-content:center; gap:8px; transition:.15s;}
.add-q-btn:hover{border-color:var(--primary); color:var(--primary-light);}

.modal-overlay{position:fixed; inset:0; background:rgba(5,3,15,.7); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;}
.modal{background:var(--panel); border:1px solid var(--border); border-radius:18px; width:100%; max-width:640px; max-height:88vh; overflow-y:auto; padding:26px;}
.modal h2{font-size:1.25rem; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center;}
.modal h2 i{cursor:pointer; color:var(--muted); font-size:1.1rem;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:0.82rem; color:var(--muted); margin-bottom:6px; font-weight:600;}
.field input[type=text], .field textarea, .field input[type=number], .field input[type=url], .field select{
  width:100%; background:var(--panel2); border:1px solid var(--border); color:#fff; border-radius:9px; padding:10px 12px; font-family:inherit; font-size:0.92rem; outline:none;
}
.field textarea{resize:vertical; min-height:60px;}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--primary);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.type-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; margin-bottom:18px;}
.type-opt{border:1.5px solid var(--border); background:var(--panel2); border-radius:12px; padding:14px 10px; text-align:center; cursor:pointer; transition:.15s;}
.type-opt i{font-size:1.4rem; display:block; margin-bottom:6px; color:var(--primary-light);}
.type-opt span{font-size:0.78rem; font-weight:600;}
.type-opt:hover{border-color:var(--primary-light);}
.type-opt.sel{border-color:var(--primary); background:rgba(124,58,237,.2);}
.opt-row{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
.opt-row input[type=text]{flex:1;}
.opt-color{width:34px; height:34px; border-radius:8px; flex-shrink:0;}
.correct-check{width:36px; height:36px; border-radius:8px; border:2px solid var(--border); background:var(--panel2); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:transparent;}
.correct-check.on{background:var(--ok); border-color:var(--ok); color:#fff;}
.modal-footer{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
.toast{position:fixed; bottom:24px; right:24px; background:var(--panel2); border:1px solid var(--border); padding:12px 18px; border-radius:10px; font-size:0.88rem; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.4); display:flex; align-items:center; gap:8px;}
.toast i{color:var(--ok);}
.hint{font-size:0.75rem; color:var(--muted); margin-top:4px;}
::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
@media(max-width:800px){.app{grid-template-columns:1fr;} .sidebar{position:fixed; z-index:40; height:100vh; transform:translateX(-100%); transition:.2s; width:280px;} .sidebar.open{transform:translateX(0);} .menu-toggle{display:block !important;}}
.menu-toggle{display:none; position:fixed; top:16px; left:16px; z-index:41; background:var(--primary); border:none; color:#fff; width:42px; height:42px; border-radius:10px; font-size:1.1rem;}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle"><i class="fa-solid fa-bars"></i></button>

<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="logo"><i class="fa-solid fa-bolt"></i> QuizMaster</div>
    <button class="btn btn-primary" id="newQuizBtn"><i class="fa-solid fa-plus"></i> Nouveau quiz</button>
    <div class="quiz-list" id="quizList"></div>
    <div style="display:flex; gap:8px;">
      <button class="btn btn-ghost btn-sm" style="flex:1;" id="exportBtn"><i class="fa-solid fa-file-export"></i> Export</button>
      <button class="btn btn-ghost btn-sm" style="flex:1;" id="importBtn"><i class="fa-solid fa-file-import"></i> Import</button>
    </div>
    <input type="file" id="importFile" accept=".json" style="display:none;">
    <a class="btn btn-ghost btn-sm" href="présentation.html" style="text-decoration:none;"><i class="fa-solid fa-tv"></i> Ouvrir la présentation</a>
  </div>

  <div class="main" id="main">
    <div class="empty-state">
      <i class="fa-solid fa-shapes"></i>
      <div>Sélectionnez un quiz à gauche ou créez-en un nouveau pour commencer.</div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot,
  orderBy, query, serverTimestamp, getDocs, getDoc, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxXW6RH9paJ66E_8E_bQpR688bTfYvBSY",
  authDomain: "samu-5ede0.firebaseapp.com",
  projectId: "samu-5ede0",
  storageBucket: "samu-5ede0.firebasestorage.app",
  messagingSenderId: "613056086995",
  appId: "1:613056086995:web:d63e43f0ed9334bbb2e526",
  measurementId: "G-251GWK26LC"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const QUESTION_TYPES = {
  qcm_single:  {label:"Choix unique",   icon:"fa-solid fa-circle-dot"},
  qcm_multiple:{label:"Choix multiple", icon:"fa-solid fa-list-check"},
  vrai_faux:   {label:"Vrai / Faux",    icon:"fa-solid fa-scale-balanced"},
  texte:       {label:"Réponse libre",  icon:"fa-solid fa-keyboard"},
  curseur:     {label:"Curseur numérique", icon:"fa-solid fa-sliders"},
  ordre:       {label:"Remise en ordre", icon:"fa-solid fa-arrow-down-1-9"},
  nuage:       {label:"Nuage de mots",  icon:"fa-solid fa-cloud"},
};
const OPT_COLORS = ["var(--red)","var(--blue)","var(--yellow)","var(--green)","var(--purple)","var(--teal)"];

let currentQuizId = null;
let currentQuiz = null;
let currentQuestions = [];
let editingQuestion = null;

// ---------- Sidebar: quiz list ----------
const quizListEl = document.getElementById("quizList");
onSnapshot(query(collection(db,"quizzes"), orderBy("updatedAt","desc")), snap=>{
  quizListEl.innerHTML = "";
  snap.forEach(d=>{
    const q = d.data();
    const el = document.createElement("div");
    el.className = "quiz-item" + (d.id===currentQuizId ? " active":"");
    el.innerHTML = `<div class="qt">${escapeHtml(q.title||"Sans titre")}</div><div class="qm">${q.questionCount||0} question(s)</div>`;
    el.onclick = ()=> openQuiz(d.id);
    quizListEl.appendChild(el);
  });
  if(!snap.size){ quizListEl.innerHTML = `<div style="color:var(--muted); font-size:0.85rem; text-align:center; padding:20px 0;">Aucun quiz pour l'instant</div>`; }
});

document.getElementById("newQuizBtn").onclick = async ()=>{
  const ref = await addDoc(collection(db,"quizzes"), {
    title:"Nouveau quiz", description:"", questionCount:0,
    createdAt: serverTimestamp(), updatedAt: serverTimestamp()
  });
  openQuiz(ref.id);
};

document.getElementById("menuToggle").onclick = ()=> document.getElementById("sidebar").classList.toggle("open");

// ---------- Open a quiz ----------
let unsubQuestions = null;
async function openQuiz(id){
  currentQuizId = id;
  document.getElementById("sidebar").classList.remove("open");
  const snap = await getDoc(doc(db,"quizzes",id));
  currentQuiz = snap.data();
  document.querySelectorAll(".quiz-item").forEach(el=>el.classList.remove("active"));
  renderQuizMain();
  if(unsubQuestions) unsubQuestions();
  unsubQuestions = onSnapshot(query(collection(db,"quizzes",id,"questions"), orderBy("order","asc")), qs=>{
    currentQuestions = qs.docs.map(d=>({id:d.id, ...d.data()}));
    renderQuestions();
  });
}

function renderQuizMain(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="quiz-header">
      <div style="flex:1; min-width:220px;">
        <input class="quiz-title-input" id="titleInput" value="${escapeAttr(currentQuiz.title||"")}" placeholder="Titre du quiz">
        <textarea class="quiz-desc-input" id="descInput" rows="1" placeholder="Description (optionnel)">${escapeHtml(currentQuiz.description||"")}</textarea>
      </div>
      <div class="header-actions">
        <button class="btn btn-primary" id="playBtn"><i class="fa-solid fa-play"></i> Lancer</button>
        <button class="btn btn-danger" id="delQuizBtn"><i class="fa-solid fa-trash"></i></button>
      </div>
    </div>
    <div class="stats-row" id="statsRow"></div>
    <div class="questions" id="questionsList"></div>
    <button class="add-q-btn" id="addQBtn" style="margin-top:14px;"><i class="fa-solid fa-plus"></i> Ajouter une question</button>
  `;
  document.getElementById("titleInput").onblur = e=> updateDoc(doc(db,"quizzes",currentQuizId), {title:e.target.value, updatedAt:serverTimestamp()});
  document.getElementById("descInput").onblur = e=> updateDoc(doc(db,"quizzes",currentQuizId), {description:e.target.value, updatedAt:serverTimestamp()});
  document.getElementById("delQuizBtn").onclick = deleteCurrentQuiz;
  document.getElementById("addQBtn").onclick = ()=> openQuestionModal(null);
  document.getElementById("playBtn").onclick = ()=>{ window.location.href = `présentation.html?quiz=${currentQuizId}`; };
}

function renderQuestions(){
  const list = document.getElementById("questionsList");
  if(!list) return;
  const totalTime = currentQuestions.reduce((a,q)=>a+(q.time||20),0);
  document.getElementById("statsRow").innerHTML = `
    <div class="stat-chip"><i class="fa-solid fa-list"></i> <b>${currentQuestions.length}</b> question(s)</div>
    <div class="stat-chip"><i class="fa-solid fa-clock"></i> ~<b>${Math.round(totalTime/60*10)/10}</b> min</div>
  `;
  list.innerHTML = "";
  currentQuestions.forEach((q,idx)=>{
    const t = QUESTION_TYPES[q.type] || {label:q.type, icon:"fa-solid fa-question"};
    let optsHtml = "";
    if(["qcm_single","qcm_multiple","vrai_faux"].includes(q.type)){
      optsHtml = `<div class="qopts">` + (q.options||[]).map(o=>`<span class="opt-pill ${o.correct?'correct':''}">${o.correct?'<i class="fa-solid fa-check"></i> ':''}${escapeHtml(o.text)}</span>`).join("") + `</div>`;
    } else if(q.type==="texte"){
      optsHtml = `<div class="qopts">${(q.acceptedAnswers||[]).map(a=>`<span class="opt-pill correct">${escapeHtml(a)}</span>`).join("")}</div>`;
    } else if(q.type==="curseur"){
      optsHtml = `<div class="qopts"><span class="opt-pill correct">Réponse: ${q.correctValue} (min ${q.min}, max ${q.max}, tolérance ±${q.tolerance})</span></div>`;
    } else if(q.type==="ordre"){
      optsHtml = `<div class="qopts">${(q.items||[]).map((it,i)=>`<span class="opt-pill correct">${i+1}. ${escapeHtml(it)}</span>`).join("")}</div>`;
    } else if(q.type==="nuage"){
      optsHtml = `<div class="qopts"><span class="opt-pill">Collecte libre, sans correction</span></div>`;
    }
    const card = document.createElement("div");
    card.className = "qcard";
    card.innerHTML = `
      <div class="qnum">${idx+1}</div>
      <div class="qcard-body">
        <div class="qcard-top">
          <div>
            <div class="qtype-badge"><i class="${t.icon}"></i> ${t.label}</div>
            <div class="qtext">${escapeHtml(q.text||"(question sans texte)")}</div>
          </div>
          <div class="qactions">
            <button class="icon-btn" title="Monter" data-act="up"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="icon-btn" title="Descendre" data-act="down"><i class="fa-solid fa-arrow-down"></i></button>
            <button class="icon-btn" title="Dupliquer" data-act="dup"><i class="fa-solid fa-copy"></i></button>
            <button class="icon-btn" title="Modifier" data-act="edit"><i class="fa-solid fa-pen"></i></button>
            <button class="icon-btn" title="Supprimer" data-act="del"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
        <div class="qmeta"><span><i class="fa-solid fa-clock"></i> ${q.time||20}s</span><span><i class="fa-solid fa-star"></i> ${q.points||1000} pts</span></div>
        ${optsHtml}
      </div>
    `;
    card.querySelector('[data-act="edit"]').onclick = ()=> openQuestionModal(q);
    card.querySelector('[data-act="del"]').onclick = ()=> deleteQuestion(q.id);
    card.querySelector('[data-act="dup"]').onclick = ()=> duplicateQuestion(q);
    card.querySelector('[data-act="up"]').onclick = ()=> moveQuestion(idx,-1);
    card.querySelector('[data-act="down"]').onclick = ()=> moveQuestion(idx,1);
    list.appendChild(card);
  });
}

async function deleteCurrentQuiz(){
  if(!confirm("Supprimer ce quiz et toutes ses questions ?")) return;
  const qs = await getDocs(collection(db,"quizzes",currentQuizId,"questions"));
  const batch = writeBatch(db);
  qs.forEach(d=>batch.delete(d.ref));
  batch.delete(doc(db,"quizzes",currentQuizId));
  await batch.commit();
  currentQuizId=null; currentQuiz=null;
  document.getElementById("main").innerHTML = `<div class="empty-state"><i class="fa-solid fa-shapes"></i><div>Sélectionnez un quiz à gauche ou créez-en un nouveau pour commencer.</div></div>`;
}

async function deleteQuestion(id){
  if(!confirm("Supprimer cette question ?")) return;
  await deleteDoc(doc(db,"quizzes",currentQuizId,"questions",id));
  await updateDoc(doc(db,"quizzes",currentQuizId), {questionCount: currentQuestions.length-1, updatedAt:serverTimestamp()});
}

async function duplicateQuestion(q){
  const copy = {...q}; delete copy.id;
  copy.order = currentQuestions.length;
  copy.text = copy.text + " (copie)";
  await addDoc(collection(db,"quizzes",currentQuizId,"questions"), copy);
  await updateDoc(doc(db,"quizzes",currentQuizId), {questionCount: currentQuestions.length+1, updatedAt:serverTimestamp()});
}

async function moveQuestion(idx, dir){
  const other = idx+dir;
  if(other<0 || other>=currentQuestions.length) return;
  const a = currentQuestions[idx], b = currentQuestions[other];
  const batch = writeBatch(db);
  batch.update(doc(db,"quizzes",currentQuizId,"questions",a.id), {order:b.order});
  batch.update(doc(db,"quizzes",currentQuizId,"questions",b.id), {order:a.order});
  await batch.commit();
}

// ---------- Question modal ----------
function openQuestionModal(q){
  editingQuestion = q;
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h2>${q?'Modifier la question':'Nouvelle question'} <i class="fa-solid fa-xmark" id="closeModal"></i></h2>
      <div class="type-grid" id="typeGrid"></div>
      <div id="formArea"></div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="cancelBtn">Annuler</button>
        <button class="btn btn-primary" id="saveQBtn"><i class="fa-solid fa-floppy-disk"></i> Enregistrer</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  document.getElementById("closeModal").onclick = ()=>overlay.remove();
  document.getElementById("cancelBtn").onclick = ()=>overlay.remove();

  const typeGrid = document.getElementById("typeGrid");
  let selectedType = q?.type || "qcm_single";
  Object.entries(QUESTION_TYPES).forEach(([key,t])=>{
    const el = document.createElement("div");
    el.className = "type-opt" + (key===selectedType?" sel":"");
    el.innerHTML = `<i class="${t.icon}"></i><span>${t.label}</span>`;
    el.onclick = ()=>{ selectedType = key; document.querySelectorAll(".type-opt").forEach(x=>x.classList.remove("sel")); el.classList.add("sel"); renderForm(selectedType, q); };
    typeGrid.appendChild(el);
  });
  renderForm(selectedType, q);

  document.getElementById("saveQBtn").onclick = async ()=>{
    const data = collectFormData(selectedType);
    if(!data) return;
    if(q){
      await updateDoc(doc(db,"quizzes",currentQuizId,"questions",q.id), data);
    } else {
      data.order = currentQuestions.length;
      await addDoc(collection(db,"quizzes",currentQuizId,"questions"), data);
      await updateDoc(doc(db,"quizzes",currentQuizId), {questionCount: currentQuestions.length+1, updatedAt:serverTimestamp()});
    }
    overlay.remove();
  };
}

function renderForm(type, q){
  const area = document.getElementById("formArea");
  const baseFields = `
    <div class="field"><label>Question</label><textarea id="f_text" placeholder="Écrivez votre question...">${escapeHtml(q?.text||"")}</textarea></div>
    <div class="field"><label>Image (URL, optionnel)</label><input type="url" id="f_image" value="${escapeAttr(q?.image||"")}" placeholder="https://..."></div>
    <div class="row2">
      <div class="field"><label>Temps (secondes)</label><input type="number" id="f_time" value="${q?.time||20}" min="5" max="300"></div>
      <div class="field"><label>Points</label><input type="number" id="f_points" value="${q?.points||1000}" min="0" step="100"></div>
    </div>
  `;
  let specific = "";
  if(type==="qcm_single" || type==="qcm_multiple"){
    const opts = q?.options || [{text:"",correct:true},{text:"",correct:false},{text:"",correct:false},{text:"",correct:false}];
    specific = `<div class="field"><label>Réponses (cochez la/les bonne(s))</label><div id="optsWrap"></div>
      <button class="btn btn-ghost btn-sm" id="addOptBtn" style="margin-top:6px;"><i class="fa-solid fa-plus"></i> Ajouter une réponse</button></div>`;
    area.innerHTML = baseFields + specific;
    renderOptsEditor(opts, type);
    document.getElementById("addOptBtn").onclick = ()=>{
      const cur = readOptsFromDom();
      if(cur.length>=6) return;
      cur.push({text:"",correct:false});
      renderOptsEditor(cur, type);
    };
  } else if(type==="vrai_faux"){
    const opts = q?.options || [{text:"Vrai",correct:true},{text:"Faux",correct:false}];
    area.innerHTML = baseFields + `<div class="field"><label>Bonne réponse</label><div id="optsWrap"></div></div>`;
    renderOptsEditor(opts, "qcm_single", true);
  } else if(type==="texte"){
    const accepted = (q?.acceptedAnswers||[""]).join(", ");
    specific = `<div class="field"><label>Réponses acceptées (séparées par des virgules)</label><input type="text" id="f_accepted" value="${escapeAttr(accepted)}" placeholder="Paris, paris, PARIS"><div class="hint">Non sensible à la casse ni aux espaces superflus.</div></div>`;
    area.innerHTML = baseFields + specific;
  } else if(type==="curseur"){
    specific = `<div class="row2">
      <div class="field"><label>Min</label><input type="number" id="f_min" value="${q?.min ?? 0}"></div>
      <div class="field"><label>Max</label><input type="number" id="f_max" value="${q?.max ?? 100}"></div>
    </div>
    <div class="row2">
      <div class="field"><label>Valeur correcte</label><input type="number" id="f_correctValue" value="${q?.correctValue ?? 50}"></div>
      <div class="field"><label>Tolérance (±)</label><input type="number" id="f_tolerance" value="${q?.tolerance ?? 5}"></div>
    </div>`;
    area.innerHTML = baseFields + specific;
  } else if(type==="ordre"){
    const items = q?.items || ["",""];
    area.innerHTML = baseFields + `<div class="field"><label>Éléments, dans l'ordre correct</label><div id="itemsWrap"></div>
      <button class="btn btn-ghost btn-sm" id="addItemBtn" style="margin-top:6px;"><i class="fa-solid fa-plus"></i> Ajouter un élément</button></div>`;
    renderItemsEditor(items);
    document.getElementById("addItemBtn").onclick = ()=>{
      const cur = readItemsFromDom(); cur.push(""); renderItemsEditor(cur);
    };
  } else if(type==="nuage"){
    area.innerHTML = baseFields + `<div class="hint" style="margin-top:-8px;">Ce type de question n'a pas de bonne réponse : les participants envoient un mot ou une courte phrase, affichés en direct.</div>`;
  }
}

function renderOptsEditor(opts, type, lockText){
  const wrap = document.getElementById("optsWrap");
  wrap.innerHTML = "";
  opts.forEach((o,i)=>{
    const row = document.createElement("div");
    row.className = "opt-row";
    row.innerHTML = `
      <div class="opt-color" style="background:${OPT_COLORS[i%OPT_COLORS.length]}"></div>
      <input type="text" value="${escapeAttr(o.text)}" placeholder="Réponse ${i+1}" ${lockText?'readonly':''}>
      <div class="correct-check ${o.correct?'on':''}" title="Bonne réponse"><i class="fa-solid fa-check"></i></div>
      ${opts.length>2 && !lockText ? '<button class="icon-btn" title="Supprimer"><i class="fa-solid fa-trash"></i></button>' : ''}
    `;
    const check = row.querySelector(".correct-check");
    check.onclick = ()=>{
      if(type==="qcm_single"){
        wrap.querySelectorAll(".correct-check").forEach(c=>c.classList.remove("on"));
        check.classList.add("on");
      } else {
        check.classList.toggle("on");
      }
    };
    const delBtn = row.querySelector(".icon-btn");
    if(delBtn) delBtn.onclick = ()=>{ const cur = readOptsFromDom(); cur.splice(i,1); renderOptsEditor(cur, type, lockText); };
    wrap.appendChild(row);
  });
}
function readOptsFromDom(){
  const wrap = document.getElementById("optsWrap");
  return [...wrap.children].map(row=>({
    text: row.querySelector("input[type=text]").value,
    correct: row.querySelector(".correct-check").classList.contains("on")
  }));
}
function renderItemsEditor(items){
  const wrap = document.getElementById("itemsWrap");
  wrap.innerHTML = "";
  items.forEach((it,i)=>{
    const row = document.createElement("div");
    row.className = "opt-row";
    row.innerHTML = `<div class="opt-color" style="background:${OPT_COLORS[i%OPT_COLORS.length]}; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff;">${i+1}</div>
      <input type="text" value="${escapeAttr(it)}" placeholder="Élément ${i+1}">
      ${items.length>2?'<button class="icon-btn"><i class="fa-solid fa-trash"></i></button>':''}`;
    const delBtn = row.querySelector(".icon-btn");
    if(delBtn) delBtn.onclick = ()=>{ const cur = readItemsFromDom(); cur.splice(i,1); renderItemsEditor(cur); };
    wrap.appendChild(row);
  });
}
function readItemsFromDom(){
  return [...document.getElementById("itemsWrap").children].map(row=>row.querySelector("input").value);
}

function collectFormData(type){
  const text = document.getElementById("f_text").value.trim();
  if(!text){ alert("Merci de saisir le texte de la question."); return null; }
  const data = {
    type, text,
    image: document.getElementById("f_image").value.trim(),
    time: parseInt(document.getElementById("f_time").value)||20,
    points: parseInt(document.getElementById("f_points").value)||1000,
  };
  if(type==="qcm_single" || type==="qcm_multiple" || type==="vrai_faux"){
    const opts = readOptsFromDom().filter(o=>o.text.trim()!=="");
    if(opts.length<2){ alert("Ajoutez au moins 2 réponses."); return null; }
    if(!opts.some(o=>o.correct)){ alert("Sélectionnez au moins une bonne réponse."); return null; }
    data.options = opts;
  } else if(type==="texte"){
    const accepted = document.getElementById("f_accepted").value.split(",").map(s=>s.trim()).filter(Boolean);
    if(!accepted.length){ alert("Ajoutez au moins une réponse acceptée."); return null; }
    data.acceptedAnswers = accepted;
  } else if(type==="curseur"){
    data.min = parseFloat(document.getElementById("f_min").value);
    data.max = parseFloat(document.getElementById("f_max").value);
    data.correctValue = parseFloat(document.getElementById("f_correctValue").value);
    data.tolerance = parseFloat(document.getElementById("f_tolerance").value);
  } else if(type==="ordre"){
    const items = readItemsFromDom().filter(i=>i.trim()!=="");
    if(items.length<2){ alert("Ajoutez au moins 2 éléments."); return null; }
    data.items = items;
  }
  return data;
}

// ---------- Export / Import ----------
document.getElementById("exportBtn").onclick = async ()=>{
  if(!currentQuizId){ alert("Ouvrez d'abord un quiz."); return; }
  const qs = await getDocs(query(collection(db,"quizzes",currentQuizId,"questions"), orderBy("order","asc")));
  const payload = {quiz: currentQuiz, questions: qs.docs.map(d=>d.data())};
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (currentQuiz.title||"quiz").replace(/\s+/g,"_") + ".json";
  a.click();
};
document.getElementById("importBtn").onclick = ()=> document.getElementById("importFile").click();
document.getElementById("importFile").onchange = async (e)=>{
  const file = e.target.files[0]; if(!file) return;
  const text = await file.text();
  try{
    const payload = JSON.parse(text);
    const ref = await addDoc(collection(db,"quizzes"), {
      title:(payload.quiz?.title||"Quiz importé")+" (import)", description:payload.quiz?.description||"",
      questionCount:(payload.questions||[]).length, createdAt:serverTimestamp(), updatedAt:serverTimestamp()
    });
    const batch = writeBatch(db);
    (payload.questions||[]).forEach((q,i)=>{
      const qref = doc(collection(db,"quizzes",ref.id,"questions"));
      batch.set(qref, {...q, order:i});
    });
    await batch.commit();
    openQuiz(ref.id);
    showToast("Quiz importé avec succès");
  }catch(err){ alert("Fichier JSON invalide."); }
  e.target.value = "";
};

function showToast(msg){
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${msg}`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3000);
}
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rejoindre - QuizMaster</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --primary:#7c3aed; --primary-dark:#5b21b6; --primary-light:#a78bfa;
  --accent:#f59e0b; --bg:#0f0b1e; --panel:#171130; --panel2:#1e1840; --border:#302a52;
  --text:#f1eefb; --muted:#a99fd1;
  --red:#e21b3c; --blue:#1368ce; --yellow:#d89e00; --green:#26890c; --purple:#8b5cf6; --teal:#0891b2;
  --ok:#22c55e; --danger:#ef4444;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
body{font-family:'Poppins',sans-serif; background:radial-gradient(circle at 50% 0%, #2a1a5e 0%, var(--bg) 60%); color:var(--text); min-height:100vh;}
.screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center;}
.btn{border:none; border-radius:14px; padding:15px 22px; font-family:inherit; font-weight:700; cursor:pointer; font-size:1.05rem; display:inline-flex; align-items:center; justify-content:center; gap:10px; transition:.15s; width:100%;}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; box-shadow:0 6px 20px rgba(124,58,237,.35);}
.btn-primary:active{transform:scale(.97);}
.btn-primary:disabled{opacity:.5;}
.btn-ghost{background:var(--panel2); color:var(--text); border:1px solid var(--border);}

.form-card{background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:30px 26px; width:100%; max-width:380px;}
.logo{font-weight:900; font-size:1.6rem; margin-bottom:22px;}
.logo i{color:var(--accent);}
input[type=text], input[type=number]{
  width:100%; background:var(--panel2); border:1px solid var(--border); color:#fff; border-radius:12px;
  padding:14px 16px; font-family:inherit; font-size:1.1rem; outline:none; margin-bottom:14px; text-align:center; font-weight:600;
}
input:focus{border-color:var(--primary);}
.error-msg{color:#fca5a5; font-size:0.85rem; margin-bottom:10px; min-height:18px;}

.wait-icon{font-size:3rem; color:var(--primary-light); margin-bottom:16px;}
.wait-title{font-size:1.4rem; font-weight:800; margin-bottom:6px;}
.wait-sub{color:var(--muted);}
.my-score{position:fixed; top:16px; right:16px; background:var(--panel2); border:1px solid var(--border); padding:8px 14px; border-radius:10px; font-weight:700; font-size:0.85rem;}

.q-header{margin-bottom:16px;}
.q-text{font-size:1.3rem; font-weight:800; margin-bottom:6px;}
.timer-chip{display:inline-block; background:var(--panel2); border:1px solid var(--border); padding:6px 14px; border-radius:20px; font-weight:700; font-size:0.85rem; margin-top:6px;}

.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:460px;}
.opt-btn{border:none; border-radius:16px; padding:26px 14px; font-size:1.1rem; font-weight:700; color:#fff; cursor:pointer; min-height:90px; display:flex; align-items:center; justify-content:center; gap:10px; transition:.12s;}
.opt-btn:active{transform:scale(.95);}
.opt-btn.selected{outline:4px solid #fff;}
.opt-btn:disabled{opacity:.5;}

.tf-grid{display:flex; flex-direction:column; gap:12px; width:100%; max-width:380px;}
.tf-btn{border:none; border-radius:16px; padding:22px; font-size:1.2rem; font-weight:800; color:#fff; cursor:pointer;}

.text-form{width:100%; max-width:380px;}
.slider-wrap{width:100%; max-width:380px;}
.slider-val{font-size:2.4rem; font-weight:900; color:var(--accent); margin:14px 0;}
input[type=range]{width:100%; accent-color:var(--primary); height:8px; margin-bottom:18px;}

.ordre-list{width:100%; max-width:380px; display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
.ordre-item{background:var(--panel2); border:1px solid var(--border); border-radius:12px; padding:14px 16px; text-align:left; cursor:pointer; font-weight:600; display:flex; align-items:center; gap:10px;}
.ordre-item.picked{opacity:.35; pointer-events:none;}
.ordre-chosen{width:100%; max-width:380px; display:flex; flex-direction:column; gap:8px; margin-bottom:16px;}
.ordre-chosen .row{background:var(--panel); border:1px solid var(--primary-light); border-radius:10px; padding:10px 14px; text-align:left; font-weight:600; font-size:0.9rem;}

.submitted-icon{font-size:4rem; color:var(--ok);}
.reveal-box{padding:26px; border-radius:20px; width:100%; max-width:380px;}
.reveal-box.correct{background:rgba(34,197,94,.15); border:2px solid var(--ok);}
.reveal-box.wrong{background:rgba(239,68,68,.15); border:2px solid var(--danger);}
.reveal-icon{font-size:3rem;}
.reveal-pts{font-size:1.6rem; font-weight:900; margin-top:8px;}

.podium-final{display:flex; align-items:flex-end; gap:14px; margin:24px 0;}
.podium-final .p{background:var(--panel); border:1px solid var(--border); border-radius:14px 14px 0 0; width:100px; padding:10px; text-align:center;}
.podium-final .p1{height:120px; order:2;}
.podium-final .p2{height:90px; order:1;}
.podium-final .p3{height:70px; order:3;}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, onSnapshot, getDoc, getDocs,
  query, where, serverTimestamp, setDoc, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBxXW6RH9paJ66E_8E_bQpR688bTfYvBSY",
  authDomain: "samu-5ede0.firebaseapp.com",
  projectId: "samu-5ede0",
  storageBucket: "samu-5ede0.firebasestorage.app",
  messagingSenderId: "613056086995",
  appId: "1:613056086995:web:d63e43f0ed9334bbb2e526",
  measurementId: "G-251GWK26LC"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const OPT_COLORS = ["var(--red)","var(--blue)","var(--yellow)","var(--green)","var(--purple)","var(--teal)"];
const OPT_ICONS = ["fa-solid fa-play","fa-solid fa-diamond","fa-solid fa-circle","fa-solid fa-square","fa-solid fa-star","fa-solid fa-heart"];

const root = document.getElementById("root");
const urlParams = new URLSearchParams(location.search);

let sessionId = null, sessionData = null, playerId = null, playerName = "", playerScore = 0;
let quiz = null, questions = [];
let unsubSession = null;
let lastRenderedKey = null; // to know when question changes
let hasAnswered = false;
let currentTimerInterval = null;

renderJoin(urlParams.get("pin") || "");

function renderJoin(prefillPin){
  root.innerHTML = `
    <div class="screen">
      <div class="form-card">
        <div class="logo"><i class="fa-solid fa-bolt"></i> Rejoindre</div>
        <div class="error-msg" id="errMsg"></div>
        <input type="text" id="pinInput" placeholder="Code PIN" inputmode="numeric" maxlength="6" value="${prefillPin}">
        <input type="text" id="nameInput" placeholder="Ton pseudo" maxlength="20">
        <button class="btn btn-primary" id="joinBtn"><i class="fa-solid fa-arrow-right"></i> Rejoindre</button>
      </div>
    </div>`;
  document.getElementById("joinBtn").onclick = tryJoin;
  document.getElementById("nameInput").addEventListener("keydown", e=>{ if(e.key==="Enter") tryJoin(); });
}

async function tryJoin(){
  const pin = document.getElementById("pinInput").value.trim();
  const name = document.getElementById("nameInput").value.trim();
  const errEl = document.getElementById("errMsg");
  errEl.textContent = "";
  if(!/^\d{6}$/.test(pin)){ errEl.textContent = "Entrez un code PIN à 6 chiffres."; return; }
  if(!name){ errEl.textContent = "Entrez votre pseudo."; return; }

  const q = query(collection(db,"sessions"), where("pin","==",pin), where("status","==","lobby"));
  const snap = await getDocs(q);
  if(snap.empty){ errEl.textContent = "Aucune partie en attente avec ce code."; return; }
  const sdoc = snap.docs[0];
  sessionId = sdoc.id;
  sessionData = sdoc.data();

  const qSnap = await getDoc(doc(db,"quizzes",sessionData.quizId));
  quiz = qSnap.data();
  const qsSnap = await getDocs(collection(db,"quizzes",sessionData.quizId,"questions"));
  questions = qsSnap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>a.order-b.order);

  const pref = await addDoc(collection(db,"sessions",sessionId,"players"), {
    name, score:0, joinedAt: serverTimestamp(), connected:true
  });
  playerId = pref.id;
  playerName = name;

  listenSession();
}

function listenSession(){
  if(unsubSession) unsubSession();
  unsubSession = onSnapshot(doc(db,"sessions",sessionId), snap=>{
    sessionData = snap.data();
    if(!sessionData) return;
    route();
  });
  onSnapshot(doc(db,"sessions",sessionId,"players",playerId), snap=>{
    const d = snap.data();
    if(d) playerScore = d.score||0;
    const el = document.getElementById("myScore");
    if(el) el.textContent = playerScore + " pts";
  });
}

function route(){
  const key = sessionData.status + "_" + sessionData.currentIndex;
  if(sessionData.status==="lobby") return renderWaiting();
  if(sessionData.status==="question"){
    if(key!==lastRenderedKey){ hasAnswered = false; lastRenderedKey = key; renderQuestion(); }
    return;
  }
  if(sessionData.status==="results"){ lastRenderedKey=key; return renderReveal(); }
  if(sessionData.status==="leaderboard"){ lastRenderedKey=key; return renderRankScreen(); }
  if(sessionData.status==="ended"){ lastRenderedKey=key; return renderFinal(); }
}

function scoreChip(){
  return `<div class="my-score" id="myScore">${playerScore} pts</div>`;
}

function renderWaiting(){
  root.innerHTML = `
    ${scoreChip()}
    <div class="screen">
      <i class="fa-solid fa-hourglass-half wait-icon"></i>
      <div class="wait-title">Salut ${escapeHtml(playerName)} !</div>
      <div class="wait-sub">En attente du démarrage par l'animateur...</div>
    </div>`;
}

function renderQuestion(){
  const q = questions[sessionData.currentIndex];
  const total = q.time || 20;
  const elapsedAtLoad = Date.now() - (sessionData.questionStartedAt||Date.now());
  const remainInit = Math.max(0, total - elapsedAtLoad/1000);

  let bodyHtml = "";
  if(q.type==="qcm_single" || q.type==="qcm_multiple"){
    bodyHtml = `<div class="opt-grid">${q.options.map((o,i)=>`
      <button class="opt-btn" style="background:${OPT_COLORS[i%OPT_COLORS.length]}" data-i="${i}"><i class="${OPT_ICONS[i%OPT_ICONS.length]}"></i> ${escapeHtml(o.text)}</button>`).join("")}</div>`;
  } else if(q.type==="vrai_faux"){
    bodyHtml = `<div class="tf-grid">${q.options.map((o,i)=>`
      <button class="tf-btn" style="background:${i===0?'var(--green)':'var(--red)'}" data-i="${i}">${escapeHtml(o.text)}</button>`).join("")}</div>`;
  } else if(q.type==="texte"){
    bodyHtml = `<div class="text-form">
      <input type="text" id="textAns" placeholder="Ta réponse..." autocomplete="off">
      <button class="btn btn-primary" id="submitText"><i class="fa-solid fa-paper-plane"></i> Envoyer</button>
    </div>`;
  } else if(q.type==="curseur"){
    const mid = Math.round((q.min+q.max)/2);
    bodyHtml = `<div class="slider-wrap">
      <div class="slider-val" id="sliderVal">${mid}</div>
      <input type="range" id="sliderInput" min="${q.min}" max="${q.max}" value="${mid}">
      <button class="btn btn-primary" id="submitSlider"><i class="fa-solid fa-paper-plane"></i> Valider</button>
    </div>`;
  } else if(q.type==="ordre"){
    const shuffled = [...q.items].map((t,i)=>({t,i})).sort(()=>Math.random()-0.5);
    bodyHtml = `<div class="ordre-chosen" id="chosenList"></div>
      <div class="ordre-list" id="ordreList">${shuffled.map(it=>`<div class="ordre-item" data-t="${escapeAttr(it.t)}"><i class="fa-solid fa-grip-lines"></i> ${escapeHtml(it.t)}</div>`).join("")}</div>
      <button class="btn btn-primary" id="submitOrdre" disabled><i class="fa-solid fa-paper-plane"></i> Valider l'ordre</button>`;
  } else if(q.type==="nuage"){
    bodyHtml = `<div class="text-form">
      <input type="text" id="textAns" placeholder="Un mot, une idée..." autocomplete="off">
      <button class="btn btn-primary" id="submitText"><i class="fa-solid fa-paper-plane"></i> Envoyer</button>
    </div>`;
  }

  root.innerHTML = `
    ${scoreChip()}
    <div class="screen">
      <div class="q-header">
        <div class="q-text">${escapeHtml(q.text)}</div>
        <div class="timer-chip" id="timerChip">${Math.ceil(remainInit)}s</div>
      </div>
      ${bodyHtml}
    </div>`;

  clearInterval(currentTimerInterval);
  currentTimerInterval = setInterval(()=>{
    const remain = Math.max(0, total - (Date.now()-(sessionData.questionStartedAt||Date.now()))/1000);
    const chip = document.getElementById("timerChip");
    if(chip) chip.textContent = Math.ceil(remain)+"s";
    if(remain<=0) clearInterval(currentTimerInterval);
  }, 300);

  if(q.type==="qcm_single" || q.type==="qcm_multiple" || q.type==="vrai_faux"){
    const isMulti = q.type==="qcm_multiple";
    let selected = new Set();
    document.querySelectorAll(".opt-btn, .tf-btn").forEach(btn=>{
      btn.onclick = ()=>{
        const i = parseInt(btn.dataset.i);
        if(isMulti){
          btn.classList.toggle("selected");
          if(selected.has(i)) selected.delete(i); else selected.add(i);
        } else {
          submitAnswer(q, i);
        }
      };
    });
    if(isMulti){
      const confirmBtn = document.createElement("button");
      confirmBtn.className = "btn btn-primary"; confirmBtn.style.marginTop="16px";
      confirmBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Valider`;
      document.querySelector(".screen").appendChild(confirmBtn);
      confirmBtn.onclick = ()=> submitAnswer(q, [...selected]);
    }
  } else if(q.type==="texte" || q.type==="nuage"){
    const submit = ()=>{
      const val = document.getElementById("textAns").value.trim();
      if(!val) return;
      submitAnswer(q, val);
    };
    document.getElementById("submitText").onclick = submit;
    document.getElementById("textAns").addEventListener("keydown", e=>{ if(e.key==="Enter") submit(); });
  } else if(q.type==="curseur"){
    const input = document.getElementById("sliderInput");
    input.oninput = ()=> document.getElementById("sliderVal").textContent = input.value;
    document.getElementById("submitSlider").onclick = ()=> submitAnswer(q, parseFloat(input.value));
  } else if(q.type==="ordre"){
    const chosen = [];
    const chosenWrap = document.getElementById("chosenList");
    document.querySelectorAll(".ordre-item").forEach(item=>{
      item.onclick = ()=>{
        item.classList.add("picked");
        chosen.push(item.dataset.t);
        const row = document.createElement("div");
        row.className = "row";
        row.textContent = chosen.length + ". " + item.dataset.t;
        chosenWrap.appendChild(row);
        if(chosen.length === q.items.length) document.getElementById("submitOrdre").disabled = false;
      };
    });
    document.getElementById("submitOrdre").onclick = ()=> submitAnswer(q, chosen);
  }
}

async function submitAnswer(q, value){
  if(hasAnswered) return;
  hasAnswered = true;
  document.querySelectorAll("button, input").forEach(el=>el.disabled = true);

  const timeMs = Date.now() - (sessionData.questionStartedAt || Date.now());
  const total = (q.time||20)*1000;
  let correct = null, points = 0;

  if(q.type==="qcm_single"){
    const correctIdx = q.options.findIndex(o=>o.correct);
    correct = value===correctIdx;
    points = correct ? speedPoints(q.points, timeMs, total) : 0;
  } else if(q.type==="qcm_multiple"){
    const correctSet = new Set(q.options.map((o,i)=>o.correct?i:null).filter(v=>v!==null));
    const givenSet = new Set(value);
    correct = correctSet.size===givenSet.size && [...correctSet].every(i=>givenSet.has(i));
    points = correct ? speedPoints(q.points, timeMs, total) : 0;
  } else if(q.type==="vrai_faux"){
    const correctIdx = q.options.findIndex(o=>o.correct);
    correct = value===correctIdx;
    points = correct ? speedPoints(q.points, timeMs, total) : 0;
  } else if(q.type==="texte"){
    const norm = s=> s.toString().trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    correct = q.acceptedAnswers.some(a=> norm(a)===norm(value));
    points = correct ? speedPoints(q.points, timeMs, total) : 0;
  } else if(q.type==="curseur"){
    const dist = Math.abs(value - q.correctValue);
    correct = dist <= q.tolerance;
    const range = Math.max(1, q.max-q.min);
    points = Math.round(q.points * Math.max(0, 1 - dist/range));
  } else if(q.type==="ordre"){
    correct = JSON.stringify(value)===JSON.stringify(q.items);
    points = correct ? speedPoints(q.points, timeMs, total) : 0;
  } else if(q.type==="nuage"){
    correct = null; points = 0;
  }

  const ansRef = doc(db,"sessions",sessionId,"answers", sessionData.currentIndex+"_"+playerId);
  await setDoc(ansRef, {
    playerId, playerName, questionIndex: sessionData.currentIndex,
    value, correct, pointsEarned: points, timeMs, answeredAt: serverTimestamp()
  });
  if(points>0){
    await updateDoc(doc(db,"sessions",sessionId,"players",playerId), {score: increment(points)});
  }
  renderSubmitted(q, correct, points);
}

function speedPoints(base, timeMs, totalMs){
  const remainRatio = Math.max(0, Math.min(1, 1 - timeMs/totalMs));
  return Math.round(base * (0.5 + 0.5*remainRatio));
}

function renderSubmitted(q, correct, points){
  let icon = `<i class="fa-solid fa-circle-check submitted-icon"></i>`;
  let msg = "Réponse envoyée !";
  if(q.type==="nuage"){
    msg = "Merci pour ta contribution !";
  }
  root.innerHTML = `
    ${scoreChip()}
    <div class="screen">
      ${icon}
      <div class="wait-title" style="margin-top:14px;">${msg}</div>
      <div class="wait-sub">En attente des autres participants...</div>
    </div>`;
}

function renderReveal(){
  const q = questions[sessionData.currentIndex];
  // fetch this player's answer for this question
  getDoc(doc(db,"sessions",sessionId,"answers", sessionData.currentIndex+"_"+playerId)).then(snap=>{
    const a = snap.exists() ? snap.data() : null;
    const correct = a ? a.correct : false;
    const points = a ? a.pointsEarned : 0;
    if(q.type==="nuage"){
      root.innerHTML = `${scoreChip()}<div class="screen">
        <i class="fa-solid fa-cloud" style="font-size:3rem; color:var(--primary-light);"></i>
        <div class="wait-title" style="margin-top:14px;">Résultats en direct à l'écran</div>
      </div>`;
      return;
    }
    root.innerHTML = `
      ${scoreChip()}
      <div class="screen">
        <div class="reveal-box ${correct?'correct':'wrong'}">
          <i class="fa-solid ${correct?'fa-check':'fa-xmark'} reveal-icon" style="color:${correct?'var(--ok)':'var(--danger)'}"></i>
          <div class="wait-title" style="margin-top:10px;">${correct?'Bonne réponse !':(a?'Pas tout à fait...':'Pas de réponse')}</div>
          ${points>0?`<div class="reveal-pts">+${points} pts</div>`:""}
        </div>
      </div>`;
  });
}

function renderRankScreen(){
  root.innerHTML = `
    ${scoreChip()}
    <div class="screen">
      <i class="fa-solid fa-trophy wait-icon" style="color:var(--accent)"></i>
      <div class="wait-title">Ton score : ${playerScore} pts</div>
      <div class="wait-sub">Regarde le classement sur l'écran principal</div>
    </div>`;
}

function renderFinal(){
  root.innerHTML = `
    <div class="screen">
      <h1 style="font-weight:900; font-size:1.8rem;">🎉 Partie terminée !</h1>
      <div class="wait-title" style="margin-top:14px;">${escapeHtml(playerName)}</div>
      <div style="font-size:2.4rem; font-weight:900; color:var(--accent); margin:10px 0;">${playerScore} pts</div>
      <div class="wait-sub">Merci d'avoir joué !</div>
    </div>`;
}

function escapeHtml(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
</script>
</body>
</html>
